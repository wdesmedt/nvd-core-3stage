frr version 10.8.0-dev_git20260824
frr defaults traditional
hostname vm1
!
route-map OWN_ROUTES_ONLY permit 10
 match as-path EMPTY
exit
!
router bgp 65001
 bgp router-id 10.1.4.16
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor leafs-v4 peer-group
 neighbor leafs-v4 remote-as 64512
 neighbor leafs-v6 peer-group
 neighbor leafs-v6 remote-as 64512
 neighbor leafs-v6 update-source 3fff:10:1:4::16
 neighbor 10.1.4.201 peer-group leafs-v4
 neighbor 10.1.4.202 peer-group leafs-v4
 neighbor 3fff:10:1:4::201 peer-group leafs-v6
 neighbor 3fff:10:1:4::202 peer-group leafs-v6
 !
 address-family ipv4 unicast
  network 6.6.6.1/32
  neighbor leafs-v4 activate
  neighbor leafs-v4 route-map OWN_ROUTES_ONLY out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8::6:1/128
  neighbor leafs-v6 activate
  neighbor leafs-v6 route-map OWN_ROUTES_ONLY out
 exit-address-family
exit
!
vrf vrf2
exit-vrf
!
router bgp 65001 vrf vrf2
 bgp router-id 10.2.4.16
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor leafs-v4 peer-group
 neighbor leafs-v4 remote-as 64512
 neighbor leafs-v6 peer-group
 neighbor leafs-v6 remote-as 64512
 neighbor leafs-v6 update-source 3fff:10:2:4::16
 neighbor 10.2.4.201 peer-group leafs-v4
 neighbor 10.2.4.202 peer-group leafs-v4
 neighbor 3fff:10:2:4::201 peer-group leafs-v6
 neighbor 3fff:10:2:4::202 peer-group leafs-v6
 !
 address-family ipv4 unicast
  network 6.6.6.2/32
  neighbor leafs-v4 activate
  neighbor leafs-v4 route-map OWN_ROUTES_ONLY out
 exit-address-family
 !
 address-family ipv6 unicast
  network 2001:db8::6:2/128
  neighbor leafs-v6 activate
  neighbor leafs-v6 route-map OWN_ROUTES_ONLY out
 exit-address-family
exit
!
bgp as-path access-list EMPTY seq 5 permit ^$
!
