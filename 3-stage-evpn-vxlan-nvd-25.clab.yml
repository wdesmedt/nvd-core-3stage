        - ip link add link bond0 name bond0.204 type vlan id 204
        - ip link set bond0.104 up
        - ip link set bond0.204 up
        - ip link set bond0.104 mtu 9000
        - ip link add br104 type bridge
        - ip link set br104 mtu 9000
        - ip link set bond0.104 master br104
        - ip link set br104 up
        - ip link set bond0.204 mtu 9000
        - ip link add br204 type bridge
        - ip link set br204 mtu 9000
        - ip link set bond0.204 master br204
        - ip link set br204 up
        - ip link set eth3 mtu 9000
        - ip link set eth3 up
        - ip link add link eth3 name eth3.104 type vlan id 104
        - ip link add link eth3 name eth3.204 type vlan id 204
        - ip link set eth3.104 mtu 9000
        - ip link set eth3.204 mtu 9000
