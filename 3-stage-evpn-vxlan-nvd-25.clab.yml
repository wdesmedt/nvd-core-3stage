        - ip link set eth3.204 master br204
        - ip link set eth3.104 up
        - ip link set eth3.204 up
        - apk add --no-cache lldpd
        - "lldpd -I '*,!eth0'"
    vm1:
      group: frr
      exec:
        - ip link add br0 type bridge
        - ip link set br0 address 02:00:00:01:04:16
        - ip link set br0 mtu 9000
        - ip link set br0 up
        - ip link add br0-keep type dummy
        - ip link set br0-keep master br0
        - ip link set br0-keep up
        - ip link add link br0 name br0.104 type vlan id 104
        - ip link set br0.104 mtu 9000
        - ip link set br0.104 up
        - ip addr add 10.1.4.16/24 dev br0.104
        - ip -6 addr add 3fff:10:1:4::16/64 dev br0.104
        - ip link add dummy11 type dummy
        - ip link set dummy11 mtu 9000
        - ip link set dummy11 up
        - ip addr add 6.6.6.1/32 dev dummy11
        - ip -6 addr add 2001:db8::6:1/128 dev dummy11
        - ip link set eth1 mtu 9000
        - ip link set eth1 master br0
        - ip link set eth1 up
        - ip link add vrf2 type vrf table 121
        - ip link set vrf2 up
        - ip link add link br0 name br0.204 type vlan id 204
        - ip link set br0.204 mtu 9000
        - ip link set br0.204 master vrf2
        - ip link set br0.204 up
        - ip addr add 10.2.4.16/24 dev br0.204
        - ip -6 addr add 3fff:10:2:4::16/64 dev br0.204
        - ip link add dummy12 type dummy
        - ip link set dummy12 master vrf2
        - ip link set dummy12 mtu 9000
        - ip link set dummy12 up
        - ip addr add 6.6.6.2/32 dev dummy12
        - ip -6 addr add 2001:db8::6:2/128 dev dummy12
    host7:
      group: host
