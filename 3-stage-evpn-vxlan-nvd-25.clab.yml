        - ip link set eth1 mtu 9000
        - ip link add link eth1 name eth1.103 type vlan id 103
        - ip link add link eth1 name eth1.203 type vlan id 203
        - ip link set eth1.103 up
        - ip link set eth1.203 up
        - ip link set eth1.103 mtu 9000
