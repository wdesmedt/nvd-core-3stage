name: 3-stage-evpn-vxlan-nvd-25

topology:
  groups:
    leaf:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.10.5
      binds:
        - node-isolation.py:/etc/opt/srlinux/eventmgr/node-isolation.py
      startup-config: srl-configs/__clabNodeName__.cfg
    spine:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:25.10.4
      startup-config: srl-configs/__clabNodeName__.cfg
    host:
      kind: linux
      image: ghcr.io/srl-labs/network-multitool:latest
    frr:
      kind: linux
      image: quay.io/frrouting/frr:master
      binds:
        - frr/__clabNodeName__:/etc/frr
  nodes:
    spine1:
      type: ixr-h5-32d
      group: spine
    spine2:
      type: ixr-h4-32d
      group: spine
    spine3:
      type: ixr-h4-32d
      group: spine
    spine4:
      type: ixr-d5
      group: spine
    leaf1:
      type: ixr-d5
      group: leaf
    leaf2:
      type: ixr-d4
      group: leaf
    leaf3:
      type: ixr-d4
      group: leaf
    leaf4:
      type: ixr-d4
      group: leaf
    leaf5:
      type: ixr-d3l
      group: leaf
    leaf6:
      type: ixr-d2l
      group: leaf
    host1:
      group: host
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast xmit_hash_policy layer2+3 min_links 1
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth3 down
        - ip link set eth4 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set eth3 master bond0
        - ip link set eth4 master bond0
        - ip link set bond0 up
        - ip link set bond0 mtu 9000
        - ip link add link bond0 name bond0.101 type vlan id 101
        - ip link add link bond0 name bond0.102 type vlan id 102
        - ip link add link bond0 name bond0.201 type vlan id 201
        - ip link set bond0.101 mtu 9000
        - ip link set bond0.102 mtu 9000
        - ip link set bond0.201 mtu 9000
        - ip link set bond0.101 up
        - ip link set bond0.102 up
        - ip link set bond0.201 up
        - ip link add vrf1 type vrf table 111
        - ip link add vrf2 type vrf table 121
        - ip link set vrf1 up
        - ip link set vrf2 up
        - ip link set bond0.101 master vrf1
        - ip link set bond0.102 master vrf1
        - ip link set bond0.201 master vrf2
        - ip addr add 10.1.1.11/24 dev bond0.101
        - ip addr add 10.1.2.11/24 dev bond0.102
        - ip addr add 10.2.1.11/24 dev bond0.201
        - ip route add 0.0.0.0/0 vrf vrf1 nexthop via 10.1.1.1 dev bond0.101 nexthop via 10.1.2.1 dev bond0.102
        - ip route add 0.0.0.0/0 vrf vrf2 nexthop via 10.2.1.1 dev bond0.201
        - ip link add link bond0 name bond0.104 type vlan id 104
        - ip link set bond0.104 mtu 9000
        - ip link set bond0.104 up
        - ip link add br104 type bridge
        - ip link set br104 mtu 9000
        - ip link set bond0.104 master br104
        - ip link set br104 up
        - ip link add link bond0 name bond0.204 type vlan id 204
        - ip link set bond0.204 mtu 9000
        - ip link set bond0.204 up
        - ip link add br204 type bridge
        - ip link set br204 mtu 9000
        - ip link set bond0.204 master br204
        - ip link set br204 up
        - "lldpd -I '*,!eth0'"
    host2:
      group: host
      exec:
        - ip link add bond0 type bond mode balance-rr xmit_hash_policy layer2+3 min_links 1
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip link set bond0 mtu 9000
        - ip link add vrf1 type vrf table 111
        - ip link set bond0 master vrf1
        - ip link set vrf1 up
        - ip addr add 10.1.2.12/24 dev bond0
        - ip route add 0.0.0.0/0 vrf vrf1 nexthop via 10.1.2.1 dev bond0
        - "lldpd -I '*,!eth0'"
    host3:
      group: host
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast xmit_hash_policy layer2+3 min_links 1
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip link add link bond0 name bond0.101 type vlan id 101
        - ip link add link bond0 name bond0.103 type vlan id 103
        - ip link add link bond0 name bond0.202 type vlan id 202
        - ip link add link bond0 name bond0.203 type vlan id 203
        - ip link set bond0 mtu 9000
        - ip link set bond0.101 mtu 9000
        - ip link set bond0.103 mtu 9000
        - ip link set bond0.202 mtu 9000
        - ip link set bond0.203 mtu 9000
        - ip link set bond0.101 up
        - ip link set bond0.103 up
        - ip link set bond0.202 up
        - ip link set bond0.203 up
        - ip link add vrf1 type vrf table 111
        - ip link add vrf2 type vrf table 121
        - ip link set vrf1 up
        - ip link set vrf2 up
        - ip link set bond0.101 master vrf1
        - ip link set bond0.103 master vrf1
        - ip link set bond0.202 master vrf2
        - ip link set bond0.203 master vrf2
        - ip addr add 10.1.1.13/24 dev bond0.101
        - ip addr add 10.1.3.13/24 dev bond0.103
        - ip addr add 10.2.2.13/24 dev bond0.202
        - ip addr add 10.2.3.13/24 dev bond0.203
        - ip route add 0.0.0.0/0 vrf vrf1 nexthop via 10.1.1.1 dev bond0.101 nexthop via 10.1.3.1 dev bond0.103
        - ip route add 0.0.0.0/0 vrf vrf2 nexthop via 10.2.2.1 dev bond0.202 nexthop via 10.2.3.1 dev bond0.203
        - ip link add link bond0 name bond0.104 type vlan id 104
        - ip link set bond0.104 mtu 9000
        - ip link set bond0.104 up
        - ip link add br104 type bridge
        - ip link set br104 mtu 9000
        - ip link set bond0.104 master br104
        - ip link set br104 up
        - ip link add link bond0 name bond0.204 type vlan id 204
        - ip link set bond0.204 mtu 9000
        - ip link set bond0.204 up
        - ip link add br204 type bridge
        - ip link set br204 mtu 9000
        - ip link set bond0.204 master br204
        - ip link set br204 up
        - "lldpd -I '*,!eth0'"
    host4:
      group: host
      exec:
        - ip link add bond0 type bond mode balance-rr xmit_hash_policy layer2+3 min_links 1
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip link set bond0 mtu 9000
        - ip link add vrf2 type vrf table 121
        - ip link set bond0 master vrf2
        - ip link set vrf2 up
        - ip addr add 10.2.2.14/24 dev bond0
        - ip route add 0.0.0.0/0 vrf vrf2 nexthop via 10.2.2.1 dev bond0
        - "lldpd -I '*,!eth0'"
    host5:
      group: frr
      exec:
        - ip link set eth1 mtu 9000
        - ip link set eth2 mtu 9000
        - ip link set eth3 mtu 9000
        - ip link set eth4 mtu 9000
        - ip addr add 10.1.5.1/31 dev eth1
        - ip addr add 10.1.5.3/31 dev eth2
        - ip addr add 10.1.5.5/31 dev eth3
        - ip addr add 10.1.5.7/31 dev eth4
        - ip -6 addr add 3fff:10:1:5::1/127 dev eth1
        - ip -6 addr add 3fff:10:1:5::3/127 dev eth2
        - ip -6 addr add 3fff:10:1:5::5/127 dev eth3
        - ip -6 addr add 3fff:10:1:5::7/127 dev eth4
        - ip link add dummy1 type dummy
        - ip link set dummy1 up
        - ip addr add 5.5.5.5/32 dev dummy1
        - ip -6 addr add 2001:db8::5/128 dev dummy1
        - ip link set dummy1 mtu 9000
        - apk add --no-cache lldpd
        - "lldpd -I '*,!eth0'"
    host6:
      group: frr
      exec:
        - ip link add bond0 type bond mode 802.3ad lacp_rate fast xmit_hash_policy layer2+3 min_links 1
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
